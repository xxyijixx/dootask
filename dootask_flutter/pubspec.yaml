name: dootask_flutter
description: DooTask Flutter
publish_to: 'none'
version: 1.3.15+212

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView核心
  webview_flutter: ^4.4.2
  webview_flutter_android: ^3.12.1
  webview_flutter_wkwebview: ^3.9.4
  
  # 文件操作
  file_picker: ^5.3.1
  image_picker: ^1.0.4
  camera: ^0.10.5+5
  
  # 分享
  share_plus: ^7.2.1
  
  # 本地存储
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # 权限管理
  permission_handler: ^11.1.0
  
  # 设备信息 - 使用兼容版本
  device_info_plus: ^8.2.2  # 降级到8.x版本
  package_info_plus: ^4.2.0
  
  # 工具库
  url_launcher: ^6.2.2
  
  # 本地HTTP服务器
  shelf: ^1.4.1
  shelf_static: ^1.1.2
  shelf_web_socket: ^1.0.4
  mime: ^1.0.4

  # HTTP客户端
  http: ^1.1.0

  # WebSocket
  web_socket_channel: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    # Electron Web应用资源（来自electron/public）
    - public/
    - public/js/
    - public/js/build/
    - public/js/ace/
    - public/js/katex/
    - public/js/recorder/
    - public/js/tinymce/
    - public/css/
    - public/css/fonts/
    - public/images/
    - public/images/application/
    - public/images/avatar/
    - public/images/browser/
    - public/images/device/
    - public/images/dialog/
    - public/images/emoticon/
    - public/images/empty/
    - public/images/ext/
    - public/images/file/
    - public/images/index/
    - public/images/other/
    - public/images/pro/
    - public/images/tray/
    - public/audio/
    - public/language/
    - public/language/api/
    - public/language/iview/
    - public/language/web/
    - public/tools/
    - public/tools/map/
    - public/assets/
    - public/assets/office/
