name: Export Docker Images and Upload to Release

on:
  workflow_dispatch:

jobs:
  export-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pro branch
        uses: actions/checkout@v4
        with:
          ref: pro

      - name: Get latest tag (pro branch)
        id: get_tag
        run: |
          latest_tag=$(git tag --sort=-creatordate | head -n 1)
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

      - name: Show latest tag
        run: echo "Latest tag: ${{ steps.get_tag.outputs.latest_tag }}

      - name: Checkout latest tag (pro branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get_tag.outputs.latest_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image names from docker-compose.yml
        id: images
        run: |
          images=$(yq '.services.*.image' docker-compose.yml | grep -v null | sort | uniq | paste -sd ' ')
          echo "images=$images" >> $GITHUB_OUTPUT

      - name: Pull images
        run: |
          for img in ${{ steps.images.outputs.images }}; do
            docker pull "$img"
          done

      - name: Save images to tar files
        run: |
          mkdir -p images
          for img in ${{ steps.images.outputs.images }}; do
            fname=$(echo $img | tr '/:' '_')
            docker save "$img" -o "images/${fname}.tar"
          done

      - name: Upload images as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: images/*.tar
          tag_name: ${{ steps.get_tag.outputs.latest_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}