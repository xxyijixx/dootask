name: "Manual Build and Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.3.15). 留空则读取 package.json'
        required: false
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.resolve-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: resolve-version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -z "$INPUT_VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          else
            VERSION="$INPUT_VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.resolve-version.outputs.version }}';
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `${version}`,
              body: '',            // 不需要更新日志
              draft: false,
              prerelease: false
            });
            return data.id;

  build-clients:
    needs: create-release
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            build_type: mac
          - platform: windows-latest
            build_type: windows
          - platform: ubuntu-latest
            build_type: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install electron deps
        run: |
          cd electron
          npm ci

      # Android
      - name: (Android) Prepare
        if: matrix.build_type == 'android'
        run: |
          git submodule init
          git submodule update --remote "resources/mobile"

      - name: (Android) Setup JDK 11
        if: matrix.build_type == 'android'
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "11"

      - name: (Android) Build
        if: matrix.build_type == 'android'
        run: |
          ./cmd appbuild publish
          cd resources/mobile/platforms/android/eeuiApp
          chmod +x ./gradlew
          ./gradlew assembleRelease --quiet

      - name: (Android) Upload APK to Release
        if: matrix.build_type == 'android'
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'resources/mobile/platforms/android/eeuiApp/app/build/outputs/apk/release';
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => f.endsWith('.apk')) : [];
            for (const file of files) {
              const filePath = path.join(dir, file);
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: process.env.RELEASE_ID,
                name: file,
                data
              });
            }

      # macOS
      - name: (macOS) Build (electron-builder publish to GitHub)
        if: matrix.build_type == 'mac'
        env:
          # 以下为可选（若需签名/公证）
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # 仅 GitHub 发布，自动提供的 token 即可
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./cmd electron mac
        # 说明：electron/build.js 在 mac 模式下会使用 electron-builder --publish always
        # 将产物直接发布到 GitHub Release，因此无需额外上传步骤

      # Windows
      - name: (Windows) Build (electron-builder publish to GitHub)
        if: matrix.build_type == 'windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./cmd electron win
        # 同 mac，electron-builder 会直接发布至 Release