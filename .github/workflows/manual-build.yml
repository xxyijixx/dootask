name: "Manual Build and Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.3.15)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ inputs.version }}' || '${{ steps.get-version.outputs.version }}';
            const releaseNotes = `${{ inputs.release_notes }}` || 'Manual build release';

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `${version}`,
              body: releaseNotes,
              draft: false,
              prerelease: false
            });

            return data.id;

  build-clients:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            build_type: "mac"
          - platform: "windows-latest"
            build_type: "windows"
          - platform: "ubuntu-latest"
            build_type: "android"

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: |
          cd electron
          npm ci

      # Android 构建步骤
      - name: (Android) Build Js
        if: matrix.build_type == 'android'
        env:
          BUILD_FRONTEND: build
        run: |
          git submodule init
          git submodule update --remote "resources/mobile"
          ./cmd appbuild publish

      - name: (Android) Setup JDK 11
        if: matrix.build_type == 'android'
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "11"

      - name: (Android) Build App
        if: matrix.build_type == 'android'
        run: |
          cd resources/mobile/platforms/android/eeuiApp
          chmod +x ./gradlew
          ./gradlew assembleRelease --quiet

      - name: (Android) Upload Release Assets
        if: matrix.build_type == 'android'
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // 查找 APK 文件
            const apkDir = 'resources/mobile/platforms/android/eeuiApp/app/build/outputs/apk/release';
            const files = fs.readdirSync(apkDir).filter(file => file.endsWith('.apk'));

            for (const file of files) {
              const filePath = path.join(apkDir, file);
              const data = fs.readFileSync(filePath);

              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: process.env.RELEASE_ID,
                name: file,
                data: data
              });
            }

      # macOS 构建步骤
      - name: (macOS) Build Client
        if: matrix.build_type == 'mac'
        env:
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./cmd electron all

      - name: (macOS) Upload Release Assets
        if: matrix.build_type == 'mac'
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // 查找构建产物
            const files = fs.readdirSync('electron/dist');

            for (const file of files) {
              if (file.includes('.dmg') || file.includes('.pkg') || file.includes('.zip')) {
                const filePath = path.join('electron/dist', file);
                const data = fs.readFileSync(filePath);

                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: process.env.RELEASE_ID,
                  name: file,
                  data: data
                });
              }
            }

      # Windows 构建步骤
      - name: (Windows) Build Client
        if: matrix.build_type == 'windows'
        env:
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          ./cmd electron all

      - name: (Windows) Upload Release Assets
        if: matrix.build_type == 'windows'
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // 查找构建产物
            const files = fs.readdirSync('electron/dist');

            for (const file of files) {
              if (file.includes('.exe') || file.includes('.msi')) {
                const filePath = path.join('electron/dist', file);
                const data = fs.readFileSync(filePath);

                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: process.env.RELEASE_ID,
                  name: file,
                  data: data
                });
              }
            }
