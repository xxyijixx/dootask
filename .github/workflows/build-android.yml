name: "Android Build and Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.3.15). 留空则读取 package.json'
        required: false
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.resolve-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: resolve-version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -z "$INPUT_VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          else
            VERSION="$INPUT_VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.resolve-version.outputs.version }}';
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `${version}`,
              body: '',            // 不需要更新日志
              draft: false,
              prerelease: false
            });
            return data.id;

  build-clients:
    needs: create-release
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            build_type: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # Android
      - name: (Android) Prepare
        if: matrix.build_type == 'android'
        run: |
          git submodule init
          git submodule update --remote "resources/mobile"

      - name: (Android) Setup JDK 11
        if: matrix.build_type == 'android'
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "11"

      - name: (Android) Build
        if: matrix.build_type == 'android'
        run: |
          ./cmd appbuild publish
          cd resources/mobile/platforms/android/eeuiApp
          chmod +x ./gradlew
          ./gradlew assembleRelease --quiet

      - name: (Android) Upload APK to Release
        if: matrix.build_type == 'android'
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'resources/mobile/platforms/android/eeuiApp/app/build/outputs/apk/release';
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => f.endsWith('.apk')) : [];
            for (const file of files) {
              const filePath = path.join(dir, file);
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: process.env.RELEASE_ID,
                name: file,
                data
              });
            }